name: cashflow

# Профили (включаются через COMPOSE_PROFILES в .env):
#   (пусто)  — только actual-server
#   sync     — + actual-auto-sync   (после привязки банков, Фаза 2)
#   ai       — + actual-ai          (LLM: LM Studio на хосте, Фаза 3)
# Пример: COMPOSE_PROFILES=sync,ai

services:
  actual-server:
    image: docker.io/actualbudget/actual-server:latest
    container_name: actual-server
    ports:
      - "5006:5006"
    volumes:
      - ./data/actual:/data
    healthcheck:
      test: ["CMD-SHELL", "node src/scripts/health-check.js"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # HTTPS-фасад для браузера: Enable Banking требует https в redirect URL.
  # Внутренние сервисы продолжают ходить на http://actual-server:5006.
  caddy:
    image: docker.io/caddy:latest
    container_name: caddy
    ports:
      - "5443:5443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    depends_on:
      actual-server:
        condition: service_healthy
    restart: unless-stopped

  actual-auto-sync:
    image: docker.io/seriouslag/actual-auto-sync:latest
    # у образа нет arm64-сборки; на Apple Silicon работает через Rosetta
    platform: linux/amd64
    container_name: actual-auto-sync
    profiles: ["sync"]
    depends_on:
      actual-server:
        condition: service_healthy
    environment:
      - ACTUAL_SERVER_URL=http://actual-server:5006
      - ACTUAL_SERVER_PASSWORD=${ACTUAL_PASSWORD}
      - ACTUAL_BUDGET_SYNC_IDS=${ACTUAL_BUDGET_SYNC_ID}
      - CRON_SCHEDULE=${AUTO_SYNC_CRON:-30 7 * * *}
      - TIMEZONE=${TZ:-Europe/Warsaw}
      - LOG_LEVEL=info
      - RUN_ON_START=${AUTO_SYNC_RUN_ON_START:-false}
      - SKIP_FAILED_ACCOUNTS=true
    restart: unless-stopped

  actual-ai:
    image: docker.io/sakowicz/actual-ai:latest
    container_name: actual-ai
    profiles: ["ai"]
    depends_on:
      actual-server:
        condition: service_healthy
    environment:
      - ACTUAL_SERVER_URL=http://actual-server:5006
      - ACTUAL_PASSWORD=${ACTUAL_PASSWORD}
      - ACTUAL_BUDGET_ID=${ACTUAL_BUDGET_SYNC_ID}
      - CLASSIFICATION_SCHEDULE_CRON=${AI_CRON:-0 8 * * *}
      # LM Studio на хосте — OpenAI-совместимый API
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://host.docker.internal:1234/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-lm-studio}
      - OPENAI_MODEL=${OPENAI_MODEL:-google/gemma-3-4b}
      - FEATURES=${AI_FEATURES}
      - GUESSED_TAG=#actual-ai
      - NOT_GUESSED_TAG=#actual-ai-miss
    restart: unless-stopped

  # Свой дашборд: React/Radix поверх @actual-app/api + курсы НБП
  dashboard:
    build: ./dashboard
    container_name: cashflow-dashboard
    ports:
      - "5055:5055"
    environment:
      - ACTUAL_SERVER_URL=http://actual-server:5006
      - ACTUAL_PASSWORD=${ACTUAL_PASSWORD}
      - ACTUAL_BUDGET_SYNC_ID=${ACTUAL_BUDGET_SYNC_ID}
      - EXCLUDED_GROUP=${EXCLUDED_GROUP:-Переводы и обмены}
      # локальное время контейнера = хост (иначе timestamp'ы бэкапов в UTC ломают ротацию)
      - TZ=${TZ:-Europe/Warsaw}
      # бэкап каноничного data/actual в iCloud после каждого успешного банк-синка
      - BACKUP_SRC=/actual
      - BACKUP_DIR=/backup
      - BACKUP_KEEP=${BACKUP_KEEP:-30}
    volumes:
      - ./data/dashboard:/data
      - ./data/actual:/actual                        # источник снапшота (rw нужен sqlite WAL)
      - ${ICLOUD_BACKUP_DIR:-./data/backups}:/backup  # куда класть архив (iCloud или локально)
    depends_on:
      actual-server:
        condition: service_healthy
    restart: unless-stopped
